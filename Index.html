<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Curtain Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Curtain Calculator</h1>

  <!-- แถบหัว + ปุ่มเพิ่มรายการ -->
  <div id="itemsHeader" class="calculator">
    <button id="addItemBtn">+ เพิ่มรายการ</button>
  </div>

  <!-- โซนวางการ์ดที่ถูกเพิ่ม -->
  <div id="itemsContainer"></div>

  <!-- สรุปทั้งหมด -->
  <div class="calculator" id="summaryBlock">
    <div class="summary-head">
      <img
        src="https://media1.tenor.com/m/BT8I5b35oMQAAAAC/oatmeal-meme.gif"
        alt="cat"
        class="cat-btn"
        onclick="summarizeAllItems()" />
      <div class="cat-text">จิ้มแมวเพื่อประเมิน</div>
    </div>
    <textarea id="summaryResult" rows="10" readonly></textarea>
    <button id="copyBtn">คัดลอก</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
